{% extends 'blog/blog.html' %}
{% block content %}
<div class="row text">
    <form method="post" enctype="multipart/form-data">
        <div class="card mb-4 box-shadow">
            <div class="card-body">
                {% csrf_token %}
                {{form.as_p}}
            </div>
            <button type="submit" class="p-2 btn btn-outline-primary">
              {% if object %}
              Сохранить
              {% else %}
              Добавить отзыв
              {% endif %}
            </button>
            <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blog' %}" role="button">Вернуться к отзывам</a>
        </div>
    </form>
</div>
{% endblock %}
