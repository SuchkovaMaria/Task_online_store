{% extends 'blog/blog.html' %}
{% load my_tags %}
{% block content %}
<div class="row text-center">
    {% for p in object_list %}
    <div class="col-3">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ p.product }}</h4>
            </div>
            <div class="card-body">
                <img src="{{p.image| media_filter}}" width="120px" height="130px">
                <p class="card-text"></h5>{{ p.name|truncatechars:20 }}</h5></p>
            <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blog_detail' p.pk %}">Посмотреть</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
