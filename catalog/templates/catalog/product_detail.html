{% extends 'catalog/home.html' %}
{% load my_tags %}
{% block content %}
<div class="row text-center">
    <div class="card mb-4 box-shadow">
        <div class="card-body">
            <h4 class="card-title">{{object.name}}</h4>
            <p class="card-text">{{object.category}}</p>
            <h6 class="card-subtitle mb-2 text-body-secondary">Цена: {{object.price}} руб.</h6>
            <img src="{{object.image| media_filter}}" width="120px" height="130px">
            <p class="card-text">{{object.description}}</p>
            <a class="p-2 btn btn-outline-primary" href="#">Добавить в корзину</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}" role="button">Вернуться в каталог</a>
            {% if user.is_authenticated %}
                <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:catalog_delete' object.pk %}">Удалить товар</a>
                <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:catalog_update' object.pk %}">Редактировать</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
